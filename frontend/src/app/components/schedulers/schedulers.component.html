<div class="container">
    <app-sidebar></app-sidebar>
    <div class="content">
        <h2 class="mb-4">Schedulers List</h2>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Robot</th>
                    <th>Zone</th>
                    <th>Start Time</th>
                    <th>End Time</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
            <tr *ngFor="let sched of schedulers">
                <td>{{ sched.id }}</td>
                <td>{{ sched.robotId }}</td>
                <td>{{ sched.zoneId }}</td>
                <td>{{ sched.startTime }}</td>
                <td>{{ sched.endTime }}</td>
                <td>
                <button class="btn btn-sm btn-primary me-2">Update</button>
                <button class="btn btn-sm btn-danger" (click)="deleteScheduler(sched.id)">Delete</button>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="text-end mb-3">
            <a class="btn btn-success" routerLink="/add-scheduler">+ Addscheduler</a>
        </div>
    </div>
</div>
