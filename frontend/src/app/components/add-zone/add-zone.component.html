<div class="container">
    <app-sidebar></app-sidebar>
    <div class="content">
        <form [formGroup]="addZoneForm" (ngSubmit)="addZone()">
            <h2>Add new Zone</h2>
            <div class="mb-2">
            <label>Zone Name</label>
            <input type="text" formControlName="name" class="form-control" />
            </div>
            <div class="text-end">
            <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>

    </div>
</div>
